<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Arb</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232354d1'/%3E%3Cpath d='M7 20h14m0 0-4-4m4 4-4 4M25 12H11m0 0 4-4m-4 4 4 4' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="index.js"></script>
</head>
<body>
  <a class="skip-link" href="#board">Skip to routes</a>

  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Arb</h1>
        <p>Confirmed cross-exchange routes saved by the tracker.</p>
      </div>

      <div class="actions">
        <div class="status" id="status" data-state="connecting" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span class="status-text" id="status-text">Connecting</span>
        </div>
        <button type="button" class="icon-btn" id="refresh" aria-label="Refresh routes" title="Refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3.5h3.5"/><path d="M4 13a8 8 0 0 0 14.9 3M20 19v-3.5h-3.5"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div class="banner" id="error-banner" role="alert">
        <span aria-hidden="true">⚠</span>
        <span id="error-text"></span>
      </div>

      <dl class="summary" aria-label="Summary of the routes shown">
        <div>
          <dt>Showing</dt>
          <dd id="sum-showing">–</dd>
        </div>
        <div>
          <dt>Best profit</dt>
          <dd id="sum-best" class="is-profit">–</dd>
        </div>
        <div>
          <dt>Average profit</dt>
          <dd id="sum-avg">–</dd>
        </div>
      </dl>

      <form class="filters" id="filters" role="search" autocomplete="off">
        <label class="field field-search">
          <span>Coin</span>
          <input type="search" id="f-q" name="q" placeholder="Search a coin, e.g. USDT" spellcheck="false">
        </label>
        <label class="field">
          <span>Exchange</span>
          <select id="f-exchange" name="exchange"><option value="">Any exchange</option></select>
        </label>
        <label class="field">
          <span>Network</span>
          <select id="f-network" name="network"><option value="">Any network</option></select>
        </label>
        <label class="field">
          <span>Min profit (USDT)</span>
          <input type="number" id="f-min" name="minProfit" inputmode="decimal" min="0" step="0.1" placeholder="0">
        </label>
        <label class="field">
          <span>Sort by</span>
          <select id="f-sort" name="sort">
            <option value="newest">Newest first</option>
            <option value="profit">Highest profit</option>
            <option value="gap">Highest real gap</option>
            <option value="symbol">Coin A to Z</option>
          </select>
        </label>
        <button type="button" class="btn-quiet" id="clear-filters">Clear filters</button>
      </form>

      <section class="board" id="board" role="table" aria-label="Arbitrage routes" aria-busy="true">
        <div class="head" id="head" role="row">
          <div role="columnheader">Coin</div>
          <div role="columnheader">Route (prices in USDT)</div>
          <div role="columnheader">Real gap</div>
          <div role="columnheader">Profit</div>
          <div role="columnheader">Network</div>
          <div role="columnheader" class="col-found">Found</div>
        </div>
        <div id="list" role="rowgroup"></div>
        <div class="state" id="state" hidden></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="noscript">Arb needs JavaScript to read the arb_coins table.</p>
  </noscript>
</body>
</html>
